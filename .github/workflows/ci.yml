name: CI

on:
  push:
    branches: [main, 'dev/v*']
  pull_request:
    branches: [main, 'dev/v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version -- "${{ github.base_ref || github.ref_name }}"
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm test
